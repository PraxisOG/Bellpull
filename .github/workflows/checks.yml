name: Android and Hermes plugin checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865' 'cmake;3.31.6'
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - run: ./android/gradlew -p android test verifyRoborazziDebug assembleDebug lintDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-check-reports
          path: |
            android/*/build/reports/
            android/app/build/outputs/roborazzi/
          retention-days: 7
  plugin:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build -f server-host/Dockerfile -t bellpull:checks .
      - name: Unmodified stock Hermes with only the Bellpull plugin
        run: >-
          docker run --rm --network none
          -e HERMES_HOME=/tmp/bellpull-stock-tests -e BELLPULL_NTFY_URL=
          -v "$PWD/plugins/bellpull:/opt/hermes/plugins/bellpull:ro"
          --entrypoint python
          nousresearch/hermes-agent:v2026.9.7@sha256:63bfb6d732f49a55d453e801057273785cc61e0f6ee43db3fa2f2a79846301b7
          -m unittest discover -s /opt/hermes/plugins/bellpull/tests -p test_portable.py -v
      - name: Projects on unmodified stock Hermes
        run: >-
          docker run --rm --network none
          -e HERMES_HOME=/tmp/bellpull-project-tests -e BELLPULL_NTFY_URL=
          -v "$PWD/plugins/bellpull:/opt/hermes/plugins/bellpull:ro"
          --entrypoint python
          nousresearch/hermes-agent:v2026.9.7@sha256:63bfb6d732f49a55d453e801057273785cc61e0f6ee43db3fa2f2a79846301b7
          -m unittest discover -s /opt/hermes/plugins/bellpull/tests -p test_projects.py -v
      - name: Coding journal and workspace containment on stock Hermes
        run: >-
          docker run --rm --network none
          -e HERMES_HOME=/tmp/bellpull-coding-tests -e BELLPULL_NTFY_URL=
          -v "$PWD/plugins/bellpull:/opt/hermes/plugins/bellpull:ro"
          --entrypoint python
          nousresearch/hermes-agent:v2026.9.24@sha256:2fd023efbb8d3d2b0ce1a73d028b07370cff34f567cfe0e999553e8c327ea283
          -m unittest discover -s /opt/hermes/plugins/bellpull/tests -p 'test_coding*.py' -v
      - name: Planning on unmodified stock Hermes
        run: >-
          docker run --rm --network none
          -e HERMES_HOME=/tmp/bellpull-planning-tests -e BELLPULL_NTFY_URL=
          -v "$PWD/plugins/bellpull:/opt/hermes/plugins/bellpull:ro"
          --entrypoint python
          nousresearch/hermes-agent:v2026.9.7@sha256:63bfb6d732f49a55d453e801057273785cc61e0f6ee43db3fa2f2a79846301b7
          -m unittest discover -s /opt/hermes/plugins/bellpull/tests -p test_planning.py -v
      - name: Real adapter, SQLite, artifacts and native runs; fake inference
        run: >-
          docker run --rm --network none
          -e HERMES_HOME=/tmp/bellpull-tests -e BELLPULL_NTFY_URL=
          --entrypoint python bellpull:checks
          -m unittest discover -s /opt/hermes/plugins/bellpull/tests -v
      - name: Check compatibility and bundled license copies
        run: |
          cmp server-host/source-sha256.json plugins/bellpull/compatibility.json
          cmp LICENSE android/app/src/main/assets/licenses/MIT-Bellpull.txt
          cmp third-party/LICENSE.commonmark-java android/app/src/main/assets/licenses/BSD-commonmark-java.txt
